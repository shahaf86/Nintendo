<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Sealed Record — Nintendo Universe Lore &amp; Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --slate-900:#141A28;
  --slate-800:#1B2233;
  --slate-700:#26304A;
  --rule:#37415E;
  --vellum:#E8E0CE;
  --vellum-dim:#B7AE9A;
  --gold:#C9A227;
  --verdigris:#4FA89B;
  --theory:#9B7BD4;
  --sealed:#5A6484;
  --font-display:"Fraunces",Georgia,serif;
  --font-body:"Archivo",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--slate-900);
  color:var(--vellum);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- chrome ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:60px;z-index:20;
  display:flex;align-items:center;gap:20px;padding:0 18px;
  background:linear-gradient(to bottom,rgba(20,26,40,.97),rgba(20,26,40,.82));
  border-bottom:1px solid var(--rule);
  backdrop-filter:blur(8px);
}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.wordmark span{display:block;font-family:var(--font-mono);font-size:9px;font-weight:400;
  letter-spacing:.22em;text-transform:uppercase;color:var(--vellum-dim);margin-top:1px}
.spacer{flex:1}
.chip{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;
  padding:5px 11px;border:1px solid var(--rule);border-radius:2px;
  color:var(--vellum-dim);transition:.15s;white-space:nowrap;
}
.chip[aria-pressed="true"]{color:var(--slate-900);background:var(--vellum);border-color:var(--vellum)}
.chip:hover{border-color:var(--gold)}
.tier-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tier-row::-webkit-scrollbar{display:none}
.tier-row .chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:7px;vertical-align:1px;background:currentColor}

/* ---------- canvas ---------- */
#stage{position:fixed;inset:60px 0 0 0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
svg{display:block;width:100%;height:100%}
.lane-rule{stroke:var(--rule);stroke-width:1;stroke-dasharray:1 7;opacity:.7}
.lane-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;fill:var(--vellum-dim);opacity:.75}
.era-tick{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;fill:var(--sealed)}

.edge{fill:none;stroke-linecap:round;transition:opacity .25s}
.edge.ghost{opacity:.09!important}
.edge-label{font-family:var(--font-mono);font-size:9.5px;fill:var(--vellum-dim);
  letter-spacing:.05em;pointer-events:none}

.node{cursor:pointer;transition:opacity .25s}
.node.ghost{opacity:.1}
.node-plate{fill:var(--slate-800);stroke-width:1;rx:3}
.node-title{font-family:var(--font-display);font-weight:500;font-size:14.5px;fill:var(--vellum)}
.node-kind{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;fill:var(--vellum-dim)}
.node:hover .node-plate{fill:#222B41}
.node.selected .node-plate{stroke:var(--gold);stroke-width:1.8}
.node.on-trail .node-plate{stroke:var(--verdigris);stroke-width:1.8}
.node.undiscovered .node-title{fill:var(--sealed)}
.node.undiscovered .node-plate{stroke-dasharray:3 3}
.discovered-mark{fill:var(--gold)}

/* ---------- panel ---------- */
.panel{
  position:fixed;top:60px;right:0;bottom:0;width:min(400px,92vw);z-index:15;
  background:var(--slate-800);border-left:1px solid var(--rule);
  transform:translateX(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.panel.open{transform:none}
.panel-head{padding:20px 22px 14px;border-bottom:1px solid var(--rule);position:relative;flex:none}
.panel-body{padding:18px 22px 40px;overflow-y:auto;flex:1}
.panel h2{font-family:var(--font-display);font-weight:500;font-size:23px;margin:0 0 4px;line-height:1.2}
.eyebrow{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--vellum-dim);margin:0 0 22px}
.panel-close{position:absolute;top:16px;right:16px;font-size:20px;line-height:1;color:var(--vellum-dim)}
.field{margin-bottom:20px}
.field-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--vellum-dim);margin-bottom:6px}
.field p{margin:0;font-size:14.5px}
.tag{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;
  padding:3px 8px;border:1px solid var(--rule);border-radius:2px;margin:0 5px 5px 0}
.list-row{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid rgba(55,65,94,.5)}
.list-row:last-child{border-bottom:none}
.list-row .ord{font-family:var(--font-mono);font-size:10px;color:var(--sealed);flex:none;width:34px}
.link-btn{text-align:left;text-decoration:underline;text-decoration-color:var(--rule);
  text-underline-offset:3px}
.link-btn:hover{text-decoration-color:var(--gold)}

/* the sealed treatment for un-encountered lore */
.sealed-text{
  font-family:var(--font-mono);font-size:13px;color:var(--sealed);
  letter-spacing:.06em;line-height:1.7;user-select:none;
}
.sealed-note{font-size:12.5px;color:var(--vellum-dim);margin-top:10px;font-style:italic}

/* ---------- drawer (journey / entities) ---------- */
.drawer{
  position:fixed;left:0;bottom:0;z-index:16;width:min(330px,90vw);
  background:var(--slate-800);border:1px solid var(--rule);border-left:none;border-bottom:none;
  border-radius:0 3px 0 0;transform:translateY(calc(100% - 42px));
  transition:transform .28s cubic-bezier(.4,0,.2,1);max-height:min(62vh,520px);
  display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer-tab{display:flex;align-items:center;gap:10px;height:42px;padding:0 16px;flex:none;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--vellum-dim);width:100%;text-align:left}
.drawer-tab b{color:var(--gold);font-weight:500}
.drawer-body{padding:4px 16px 18px;overflow-y:auto}
.seg{display:flex;gap:4px;margin-bottom:14px}
.seg button{flex:1;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;padding:6px 0;border:1px solid var(--rule);color:var(--vellum-dim)}
.seg button[aria-pressed="true"]{background:var(--vellum);color:var(--slate-900);border-color:var(--vellum)}
.check-row{display:flex;align-items:center;gap:11px;padding:7px 0;cursor:pointer;width:100%;text-align:left}
.box{width:15px;height:15px;border:1px solid var(--rule);border-radius:2px;flex:none;
  display:grid;place-items:center;font-size:10px;color:var(--slate-900)}
.check-row[aria-pressed="true"] .box{background:var(--gold);border-color:var(--gold)}
.check-row .yr{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--sealed)}
.entity-row .kind{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;color:var(--sealed);
  margin-left:auto;text-transform:uppercase}
.entity-row[aria-pressed="true"]{color:var(--verdigris)}

/* ---------- misc ---------- */
.legend{position:fixed;right:16px;bottom:14px;z-index:12;font-family:var(--font-mono);
  font-size:9.5px;letter-spacing:.1em;color:var(--sealed);text-align:right;pointer-events:none}
.zoombar{position:fixed;left:16px;top:76px;z-index:12;display:flex;flex-direction:column;gap:1px}
.zoombar button{width:30px;height:30px;border:1px solid var(--rule);background:rgba(27,34,51,.9);
  color:var(--vellum-dim);font-size:15px;line-height:1}
.zoombar button:hover{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:30;
  background:var(--vellum);color:var(--slate-900);padding:9px 16px;border-radius:2px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .wordmark span{display:none}
  .topbar{gap:12px;padding:0 12px}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wordmark">The Sealed Record<span>Lore &amp; Timeline</span></div>
  <div class="tier-row" id="tierRow" role="group" aria-label="Filter by canon tier"></div>
  <div class="spacer"></div>
  <button class="chip" id="resetView">Reset view</button>
</header>

<div class="zoombar">
  <button id="zoomIn" aria-label="Zoom in">+</button>
  <button id="zoomOut" aria-label="Zoom out">–</button>
</div>

<div id="stage">
  <svg id="canvas" role="img" aria-label="Branching lore timeline">
    <defs>
      <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
      </marker>
    </defs>
    <g id="viewport">
      <g id="gLanes"></g>
      <g id="gEdges"></g>
      <g id="gEdgeLabels"></g>
      <g id="gNodes"></g>
    </g>
  </svg>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <div class="panel-head">
    <button class="panel-close" id="panelClose" aria-label="Close">×</button>
    <h2 id="panelTitle"></h2>
    <p class="eyebrow" id="panelEyebrow"></p>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<div class="drawer" id="drawer">
  <button class="drawer-tab" id="drawerTab" aria-expanded="false">
    My lore journey <b id="journeyCount">0 / 0</b>
  </button>
  <div class="drawer-body">
    <div class="seg" role="group">
      <button id="tabGames" aria-pressed="true">Games</button>
      <button id="tabEntities" aria-pressed="false">Entities</button>
    </div>
    <div id="drawerList"></div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Storage shim — real persistence where it's allowed, memory where it isn't.
   ========================================================================= */
const store = (() => {
  const mem = {};
  let ok = false;
  try { const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); ok=true; } catch(e){}
  return {
    persistent: ok,
    get(k, fb){ try { const v = ok ? localStorage.getItem(k) : mem[k];
      return v==null ? fb : JSON.parse(v); } catch(e){ return fb; } },
    set(k, v){ const s = JSON.stringify(v);
      try { if(ok) localStorage.setItem(k,s); else mem[k]=s; } catch(e){ mem[k]=s; } }
  };
})();

/* =========================================================================
   Fallback data. Replaced at runtime by ./data/graph.json when present.
   ========================================================================= */
const FALLBACK = {
  branches:[
    {id:"b0",slug:"trunk",name:"Founding Era",lane:0,tier:"OFFICIAL_PRIMARY",color:"#8A93AD"},
    {id:"b1",slug:"child-era",name:"Child Era",lane:-1,tier:"OFFICIAL_SECONDARY",color:"#5B9BD5"},
    {id:"b2",slug:"adult-era",name:"Adult Era",lane:1,tier:"OFFICIAL_SECONDARY",color:"#4FA89B"},
    {id:"b3",slug:"fallen-hero",name:"Fallen Hero",lane:2,tier:"OFFICIAL_SECONDARY",color:"#C4574F"}
  ],
  games:[
    {id:"g1",title:"Skyward Sword",year:2011},
    {id:"g2",title:"Ocarina of Time",year:1998},
    {id:"g3",title:"Majora's Mask",year:2000},
    {id:"g4",title:"Twilight Princess",year:2006},
    {id:"g5",title:"The Wind Waker",year:2002},
    {id:"g6",title:"A Link to the Past",year:1991}
  ],
  nodes:[
    {id:"n1",branch:"b0",kind:"BACKSTORY",order:100,title:"Demise's Curse",tier:"OFFICIAL_PRIMARY",games:[],spoiler:1,
     summary:"A dying demon king binds his hatred to the bloodlines of the hero and the goddess. Every later conflict is a repetition of this moment."},
    {id:"n2",branch:"b0",kind:"GAME",order:200,title:"Skyward Sword",tier:"OFFICIAL_PRIMARY",games:["g1"],spoiler:0,
     summary:"The first hero descends from the sky. The Goddess Sword is reforged into the Master Sword."},
    {id:"n3",branch:"b0",kind:"GAME",order:300,title:"Ocarina of Time",tier:"OFFICIAL_PRIMARY",games:["g2"],spoiler:1,
     summary:"A child draws the Master Sword and is sealed away for seven years while Ganondorf claims the Sacred Realm."},
    {id:"n4",branch:"b0",kind:"SPLIT",order:400,title:"The Ocarina Split",tier:"OFFICIAL_SECONDARY",games:["g2"],spoiler:3,
     summary:"Zelda returns Link to his own time. History forks three ways: the child who went back, the adult era he left behind, and the branch where he lost."},
    {id:"n5",branch:"b1",kind:"GAME",order:500,title:"Majora's Mask",tier:"OFFICIAL_PRIMARY",games:["g3"],spoiler:0,
     summary:"The returned child searches for a lost companion and stumbles into Termina, a world three days from its end."},
    {id:"n6",branch:"b1",kind:"GAME",order:600,title:"Twilight Princess",tier:"OFFICIAL_PRIMARY",games:["g4"],spoiler:2,
     summary:"Centuries on. A spirit calling himself the Hero's Shade teaches a new Link the sword forms of a forgotten era."},
    {id:"n7",branch:"b2",kind:"EVENT",order:500,title:"The Great Flood",tier:"OFFICIAL_PRIMARY",games:["g5"],spoiler:2,
     summary:"With the hero gone from this era and no one to answer Ganondorf's return, the gods drown Hyrule rather than let it fall."},
    {id:"n8",branch:"b2",kind:"GAME",order:600,title:"The Wind Waker",tier:"OFFICIAL_PRIMARY",games:["g5"],spoiler:0,
     summary:"On the Great Sea, a boy with no hero's blood takes up the role anyway."},
    {id:"n9",branch:"b3",kind:"EVENT",order:500,title:"The Imprisoning War",tier:"OFFICIAL_SECONDARY",games:[],spoiler:2,
     summary:"The hero falls. Seven Sages seal Ganon inside the Sacred Realm at enormous cost."},
    {id:"n10",branch:"b3",kind:"GAME",order:600,title:"A Link to the Past",tier:"OFFICIAL_PRIMARY",games:["g6"],spoiler:0,
     summary:"Generations later the seal thins, and the wizard Agahnim works to break it from the inside."}
  ],
  edges:[
    {from:"n1",to:"n2",kind:"CAUSAL",label:"sets the cycle",tier:"OFFICIAL_PRIMARY"},
    {from:"n2",to:"n3",kind:"CHRONOLOGICAL",tier:"OFFICIAL_PRIMARY"},
    {from:"n3",to:"n4",kind:"CHRONOLOGICAL",tier:"OFFICIAL_PRIMARY"},
    {from:"n4",to:"n5",kind:"SPLIT_FROM",label:"hero returned",tier:"OFFICIAL_SECONDARY"},
    {from:"n4",to:"n7",kind:"SPLIT_FROM",label:"hero departed",tier:"OFFICIAL_SECONDARY"},
    {from:"n4",to:"n9",kind:"SPLIT_FROM",label:"hero defeated",tier:"OFFICIAL_SECONDARY"},
    {from:"n5",to:"n6",kind:"CHRONOLOGICAL",label:"centuries",tier:"OFFICIAL_PRIMARY"},
    {from:"n7",to:"n8",kind:"CAUSAL",tier:"OFFICIAL_PRIMARY"},
    {from:"n9",to:"n10",kind:"CHRONOLOGICAL",tier:"OFFICIAL_SECONDARY"},
    {from:"n3",to:"n6",kind:"REINCARNATION",label:"the Hero's Shade",tier:"OFFICIAL_PRIMARY"},
    {from:"n5",to:"n8",kind:"REFERENCES",label:"Termina is a dream of the drowned world",tier:"COMMUNITY_THEORY"}
  ],
  entities:[
    {id:"e1",kind:"CHARACTER",name:"Link",appearances:[
      {node:"n3",role:"protagonist",incarnation:"Hero of Time"},
      {node:"n5",role:"protagonist",incarnation:"Hero of Time"},
      {node:"n6",role:"mentor",incarnation:"Hero of Time"},
      {node:"n8",role:"protagonist",incarnation:"Hero of Winds"}]},
    {id:"e2",kind:"CHARACTER",name:"Ganondorf",appearances:[
      {node:"n3",role:"antagonist"},{node:"n7",role:"antagonist"},
      {node:"n9",role:"antagonist"},{node:"n10",role:"antagonist"}]},
    {id:"e3",kind:"ARTIFACT",name:"The Triforce",appearances:[
      {node:"n1",role:"origin"},{node:"n3",role:"macguffin"},
      {node:"n9",role:"macguffin"},{node:"n10",role:"macguffin"}]},
    {id:"e4",kind:"ARTIFACT",name:"Master Sword",appearances:[
      {node:"n2",role:"origin"},{node:"n3",role:"key"},
      {node:"n6",role:"key"},{node:"n8",role:"key"}]}
  ]
};

const TIERS = [
  {id:"OFFICIAL_PRIMARY",   label:"In-game",   color:"#E8E0CE", dash:null},
  {id:"OFFICIAL_SECONDARY", label:"Official",  color:"#C9A227", dash:null},
  {id:"OFFICIAL_AMBIGUOUS", label:"Ambiguous", color:"#8A93AD", dash:"6 4"},
  {id:"RETCONNED",          label:"Retconned", color:"#6B7391", dash:"2 5"},
  {id:"COMMUNITY_THEORY",   label:"Theory",    color:"#9B7BD4", dash:"7 5"}
];
const tierOf = id => TIERS.find(t=>t.id===id) || TIERS[0];

/* ========================================================================= */
const NODE_W=196, NODE_H=74, LANE_H=152, X_UNIT=2.6, X_PAD=140;

let DATA = FALLBACK;
let active = new Set(store.get("tiers", ["OFFICIAL_PRIMARY","OFFICIAL_SECONDARY"]));
let played = new Set(store.get("played", []));
let focusEntity = null, selectedNode = null, drawerTab = "games";
const pos = new Map();

const $ = s => document.querySelector(s);
const svg = $("#canvas"), vp = $("#viewport");

function layout(){
  pos.clear();
  const orders = DATA.nodes.map(n=>n.order);
  const minO = Math.min(...orders);
  const lanes = new Map(DATA.branches.map(b=>[b.id,b.lane]));
  const laneVals = [...lanes.values()];
  const minLane = Math.min(...laneVals);
  DATA.nodes.forEach(n=>{
    pos.set(n.id, {
      x: X_PAD + (n.order - minO) * X_UNIT,
      y: 110 + ((lanes.get(n.branch) ?? 0) - minLane) * LANE_H
    });
  });
}

function branchOf(id){ return DATA.branches.find(b=>b.id===id) || DATA.branches[0]; }
function nodeById(id){ return DATA.nodes.find(n=>n.id===id); }
function gameById(id){ return DATA.games.find(g=>g.id===id); }

function discovered(node){
  if(!node.games || !node.games.length) {
    // Nodes with no game of their own inherit from anything that points at them.
    return DATA.edges.some(e => e.to===node.id && (nodeById(e.from)?.games||[]).some(g=>played.has(g)));
  }
  return node.games.some(g=>played.has(g));
}
function trailNodes(){
  if(!focusEntity) return null;
  const ent = DATA.entities.find(e=>e.id===focusEntity);
  return new Set((ent?.appearances||[]).map(a=>a.node));
}

/* ---------- render ---------- */
function render(){
  layout();
  const trail = trailNodes();
  const gLanes=$("#gLanes"), gEdges=$("#gEdges"), gLbl=$("#gEdgeLabels"), gNodes=$("#gNodes");
  [gLanes,gEdges,gLbl,gNodes].forEach(g=>g.textContent="");

  const xs=[...pos.values()].map(p=>p.x);
  const x0=Math.min(...xs)-90, x1=Math.max(...xs)+NODE_W+90;

  // lanes
  DATA.branches.forEach(b=>{
    const sample = DATA.nodes.find(n=>n.branch===b.id);
    if(!sample) return;
    const y = pos.get(sample.id).y + NODE_H/2;
    gLanes.appendChild(el("line",{x1:x0,y1:y,x2:x1,y2:y,class:"lane-rule"}));
    const t = el("text",{x:x0,y:y-16,class:"lane-label"}); t.textContent=b.name.toUpperCase();
    gLanes.appendChild(t);
  });

  // edges
  DATA.edges.forEach(e=>{
    const a=pos.get(e.from), b=pos.get(e.to); if(!a||!b) return;
    const t=tierOf(e.tier), on=active.has(e.tier);
    const sx=a.x+NODE_W, sy=a.y+NODE_H/2, ex=b.x, ey=b.y+NODE_H/2;
    let d;
    if(e.kind==="REINCARNATION" || e.kind==="REFERENCES"){
      const lift = Math.min(90, Math.abs(ey-sy)/2 + 46);
      d=`M${sx-NODE_W/2},${sy-NODE_H/2} C${sx+60},${sy-lift} ${ex+NODE_W/2-60},${ey-lift} ${ex+NODE_W/2},${ey-NODE_H/2}`;
    } else {
      const mx=(sx+ex)/2;
      d=`M${sx},${sy} C${mx},${sy} ${mx},${ey} ${ex},${ey}`;
    }
    const stroke = e.kind==="SPLIT_FROM" ? branchOf(nodeById(e.to).branch).color : t.color;
    const dash = t.dash || (e.kind==="REINCARNATION" ? "5 5" : null);
    const p = el("path",{d, class:"edge"+(on?"":" ghost"), stroke,
      "stroke-width": e.kind==="SPLIT_FROM"?2.4:1.6,
      "stroke-dasharray": dash||"", opacity: on?.85:.09,
      "marker-end":"url(#arrow)", style:`color:${stroke}`});
    gEdges.appendChild(p);

    if(e.label && on){
      const mx=(sx+ex)/2, my=(sy+ey)/2 - (e.kind==="REINCARNATION"?58:9);
      const tx=el("text",{x:mx,y:my,class:"edge-label","text-anchor":"middle"});
      tx.textContent=e.label; gLbl.appendChild(tx);
    }
  });

  // nodes
  DATA.nodes.forEach(n=>{
    const p=pos.get(n.id), br=branchOf(n.branch), t=tierOf(n.tier);
    const on=active.has(n.tier);
    const seen=discovered(n);
    const cls=["node"];
    if(!on) cls.push("ghost");
    if(selectedNode===n.id) cls.push("selected");
    if(trail && trail.has(n.id)) cls.push("on-trail");
    if(!seen) cls.push("undiscovered");

    const g=el("g",{class:cls.join(" "), transform:`translate(${p.x},${p.y})`,
      tabindex:"0", role:"button", "aria-label":n.title});
    g.appendChild(el("rect",{class:"node-plate",width:NODE_W,height:NODE_H,rx:3,
      stroke:t.color, "stroke-opacity":.45}));
    g.appendChild(el("rect",{width:3,height:NODE_H,fill:br.color,rx:1.5}));

    const kd=el("text",{x:16,y:23,class:"node-kind"});
    kd.textContent=n.kind; g.appendChild(kd);

    const ti=el("text",{x:16,y:46,class:"node-title"});
    ti.textContent = n.title.length>24 ? n.title.slice(0,23)+"…" : n.title;
    g.appendChild(ti);

    if(seen) g.appendChild(el("circle",{cx:NODE_W-15,cy:19,r:3.2,class:"discovered-mark"}));

    const sub=el("text",{x:16,y:62,class:"node-kind"});
    sub.textContent = seen ? "" : "· sealed ·"; g.appendChild(sub);

    const open=()=>openNode(n.id);
    g.addEventListener("click",open);
    g.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();open();} });
    gNodes.appendChild(g);
  });
}

function el(tag,attrs){
  const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs) if(attrs[k]!==""&&attrs[k]!=null) e.setAttribute(k,attrs[k]);
  return e;
}

/* ---------- panel ---------- */
function openNode(id){
  selectedNode=id; render();
  const n=nodeById(id), br=branchOf(n.branch), t=tierOf(n.tier);
  const seen=discovered(n);
  $("#panelTitle").textContent=n.title;
  $("#panelEyebrow").textContent=`${br.name} · ${n.kind.toLowerCase()} · ${t.label}`;

  let html="";
  if(seen || n.spoiler===0){
    html+=`<div class="field"><div class="field-label">What happens</div><p>${esc(n.summary)}</p></div>`;
  } else {
    html+=`<div class="field"><div class="field-label">What happens</div>
      <div class="sealed-text">${"▓".repeat(14)} ▓▓▓▓ ${"▓".repeat(9)}<br>${"▓".repeat(11)} ▓▓▓▓▓▓ ${"▓".repeat(6)}</div>
      <p class="sealed-note">Sealed. Log ${n.games.length?esc(gameById(n.games[0])?.title||"the relevant game"):"a game that leads here"} as played to break the seal.</p></div>`;
  }

  const gs=(n.games||[]).map(g=>gameById(g)).filter(Boolean);
  if(gs.length) html+=`<div class="field"><div class="field-label">Appears in</div>
    ${gs.map(g=>`<span class="tag">${esc(g.title)}</span>`).join("")}</div>`;

  const here=DATA.entities.filter(e=>e.appearances.some(a=>a.node===id));
  if(here.length) html+=`<div class="field"><div class="field-label">Present here</div>${
    here.map(e=>{const a=e.appearances.find(x=>x.node===id);
      return `<div class="list-row"><button class="link-btn" data-ent="${e.id}">${esc(e.name)}</button>
        <span style="color:var(--sealed);font-size:12px">${esc(a.incarnation||a.role||"")}</span></div>`;
    }).join("")}</div>`;

  const outs=DATA.edges.filter(e=>e.from===id), ins=DATA.edges.filter(e=>e.to===id);
  const line=(e,dir)=>{const o=nodeById(dir==="out"?e.to:e.from); if(!o) return "";
    return `<div class="list-row"><span class="ord">${dir==="out"?"→":"←"}</span>
      <button class="link-btn" data-node="${o.id}">${esc(o.title)}</button>
      <span style="margin-left:auto;font-family:var(--font-mono);font-size:9px;color:var(--sealed)">${e.kind}</span></div>`;};
  if(ins.length) html+=`<div class="field"><div class="field-label">Leads from</div>${ins.map(e=>line(e,"in")).join("")}</div>`;
  if(outs.length) html+=`<div class="field"><div class="field-label">Leads to</div>${outs.map(e=>line(e,"out")).join("")}</div>`;

  $("#panelBody").innerHTML=html;
  $("#panelBody").querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{openNode(b.dataset.node);centerOn(b.dataset.node);});
  $("#panelBody").querySelectorAll("[data-ent]").forEach(b=>b.onclick=()=>setFocus(b.dataset.ent));
  $("#panel").classList.add("open");
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- viewport ---------- */
let view={x:0,y:0,k:1};
function applyView(){ vp.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`); }
function resetView(){
  const r=svg.getBoundingClientRect();
  const xs=[...pos.values()].map(p=>p.x), ys=[...pos.values()].map(p=>p.y);
  const w=Math.max(...xs)+NODE_W+160-(Math.min(...xs)-160);
  const h=Math.max(...ys)+NODE_H+120-(Math.min(...ys)-120);
  view.k=Math.min(1.05, Math.min(r.width/w, r.height/h));
  view.x=(r.width - w*view.k)/2 - (Math.min(...xs)-160)*view.k;
  view.y=(r.height - h*view.k)/2 - (Math.min(...ys)-120)*view.k;
  applyView();
}
function centerOn(id){
  const p=pos.get(id); if(!p) return;
  const r=svg.getBoundingClientRect();
  view.x=r.width/2 - (p.x+NODE_W/2)*view.k;
  view.y=r.height/2 - (p.y+NODE_H/2)*view.k;
  applyView();
}
(function pan(){
  const st=$("#stage"); let d=false,lx=0,ly=0;
  st.addEventListener("pointerdown",e=>{ if(e.target.closest(".node"))return;
    d=true;lx=e.clientX;ly=e.clientY;st.classList.add("dragging");st.setPointerCapture(e.pointerId);});
  st.addEventListener("pointermove",e=>{ if(!d)return;
    view.x+=e.clientX-lx; view.y+=e.clientY-ly; lx=e.clientX; ly=e.clientY; applyView();});
  const up=e=>{d=false;st.classList.remove("dragging");};
  st.addEventListener("pointerup",up); st.addEventListener("pointercancel",up);
  st.addEventListener("wheel",e=>{ e.preventDefault();
    const r=svg.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const f=Math.exp(-e.deltaY*0.0015), nk=Math.max(.25,Math.min(2.4,view.k*f));
    view.x=mx-(mx-view.x)*(nk/view.k); view.y=my-(my-view.y)*(nk/view.k); view.k=nk; applyView();
  },{passive:false});
  let pd=null;
  st.addEventListener("touchmove",e=>{
    if(e.touches.length!==2) return; e.preventDefault();
    const [a,b]=e.touches, dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pd){ const nk=Math.max(.25,Math.min(2.4,view.k*(dist/pd)));
      const r=svg.getBoundingClientRect(), mx=(a.clientX+b.clientX)/2-r.left, my=(a.clientY+b.clientY)/2-r.top;
      view.x=mx-(mx-view.x)*(nk/view.k); view.y=my-(my-view.y)*(nk/view.k); view.k=nk; applyView(); }
    pd=dist;
  },{passive:false});
  st.addEventListener("touchend",()=>{pd=null;});
})();

/* ---------- controls ---------- */
function buildTiers(){
  const row=$("#tierRow"); row.textContent="";
  TIERS.forEach(t=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=t.label; b.style.color=t.color;
    b.setAttribute("aria-pressed", active.has(t.id));
    b.onclick=()=>{ active.has(t.id)?active.delete(t.id):active.add(t.id);
      store.set("tiers",[...active]); buildTiers(); render(); };
    row.appendChild(b);
  });
}
function buildDrawer(){
  const list=$("#drawerList"); list.textContent="";
  $("#journeyCount").textContent=`${played.size} / ${DATA.games.length}`;
  $("#tabGames").setAttribute("aria-pressed", drawerTab==="games");
  $("#tabEntities").setAttribute("aria-pressed", drawerTab==="entities");

  if(drawerTab==="games"){
    DATA.games.forEach(g=>{
      const b=document.createElement("button");
      b.className="check-row"; b.setAttribute("aria-pressed", played.has(g.id));
      b.innerHTML=`<span class="box">✓</span><span>${esc(g.title)}</span><span class="yr">${g.year||""}</span>`;
      b.onclick=()=>{ played.has(g.id)?played.delete(g.id):played.add(g.id);
        store.set("played",[...played]); buildDrawer(); render();
        if(selectedNode) openNode(selectedNode);
        toast(played.has(g.id) ? `${g.title} logged — paths revealed` : `${g.title} un-logged`); };
      list.appendChild(b);
    });
  } else {
    DATA.entities.forEach(e=>{
      const b=document.createElement("button");
      b.className="check-row entity-row"; b.setAttribute("aria-pressed", focusEntity===e.id);
      b.innerHTML=`<span>${esc(e.name)}</span><span class="kind">${e.kind}</span>`;
      b.onclick=()=>setFocus(focusEntity===e.id?null:e.id);
      list.appendChild(b);
    });
  }
}
function setFocus(id){
  focusEntity=id; buildDrawer(); render();
  if(id){
    const e=DATA.entities.find(x=>x.id===id);
    $("#panelTitle").textContent=e.name;
    $("#panelEyebrow").textContent=`${e.kind.toLowerCase()} · ${e.appearances.length} appearances`;
    $("#panelBody").innerHTML=`<div class="field"><div class="field-label">Chronological trail</div>${
      e.appearances.map(a=>{const n=nodeById(a.node); if(!n) return "";
        return `<div class="list-row"><span class="ord">${n.order}</span>
          <button class="link-btn" data-node="${n.id}">${esc(n.title)}</button>
          <span style="margin-left:auto;font-size:11px;color:var(--sealed)">${esc(a.incarnation||a.role||"")}</span></div>`;
      }).join("")}</div>
      <p class="sealed-note">Highlighted on the canvas in verdigris. Tap the name again to clear.</p>`;
    $("#panelBody").querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{openNode(b.dataset.node);centerOn(b.dataset.node);});
    $("#panel").classList.add("open");
    $("#drawer").classList.add("open"); $("#drawerTab").setAttribute("aria-expanded","true");
  }
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

$("#panelClose").onclick=()=>{ $("#panel").classList.remove("open"); selectedNode=null; render(); };
$("#resetView").onclick=resetView;
$("#zoomIn").onclick=()=>{ view.k=Math.min(2.4,view.k*1.25); applyView(); };
$("#zoomOut").onclick=()=>{ view.k=Math.max(.25,view.k/1.25); applyView(); };
$("#drawerTab").onclick=()=>{ const d=$("#drawer"), o=d.classList.toggle("open");
  $("#drawerTab").setAttribute("aria-expanded",o); };
$("#tabGames").onclick=()=>{ drawerTab="games"; buildDrawer(); };
$("#tabEntities").onclick=()=>{ drawerTab="entities"; buildDrawer(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){
  $("#panel").classList.remove("open"); selectedNode=null; render(); }});

$("#legend").innerHTML = "drag to pan · scroll or pinch to zoom · tap a node to open it";

/* ---------- boot ---------- */
async function boot(){
  try{
    const r=await fetch("./data/graph.json",{cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j&&j.nodes&&j.nodes.length) DATA=j; }
  }catch(e){ /* offline or opened via file:// — fallback stands */ }
  buildTiers(); buildDrawer(); render(); resetView();
  if(!store.persistent) toast("Progress won't persist here — it will on your own domain");
}
boot();
window.addEventListener("resize",()=>applyView());
</script>
</body>
